# TARS: keep NetworkManager's hands off the tether interface.
# NM "manages" usb0 into link-local limbo and fights the static fallback in
# tars-tether.sh. With usb0 unmanaged, the udev rule + service ExecStartPre own it fully.
# Install once: sudo cp 99-tars-net.conf /etc/NetworkManager/conf.d/ && sudo systemctl reload NetworkManager
[keyfile]
unmanaged-devices=interface-name:usb0
